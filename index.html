<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Bunk Spot | Mobile Ordering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-28">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-white shadow-md">
        <i data-lucide="ice-cream" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold tracking-tight text-slate-900 leading-none">THE BUNK SPOT</h1>
        <p class="text-[10px] font-semibold text-amber-600 uppercase tracking-wider">Campus Dessert Bar</p>
      </div>
    </div>
    <button onclick="toggleOrdersModal()" class="relative p-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition">
      <i data-lucide="clock" class="w-5 h-5"></i>
      <span id="activeOrdersBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 bg-orange-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
    </button>
  </header>

  <!-- Hero Banner -->
  <div class="p-4">
    <div class="bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-400 rounded-2xl p-4 text-white shadow-lg relative overflow-hidden">
      <div class="relative z-10">
        <span class="inline-block px-2.5 py-0.5 rounded-full bg-white/20 text-[11px] font-bold uppercase tracking-wider mb-1">Instant Kitchen Dispatch</span>
        <h2 class="text-lg font-black leading-tight">Chill Anytime, Hangout Everyday</h2>
        <p class="text-xs text-amber-100 mt-1">Apna order select karein, counter par turant receive ho jayega.</p>
      </div>
      <div class="absolute -right-4 -bottom-4 text-white/10">
        <i data-lucide="sparkles" class="w-28 h-28"></i>
      </div>
    </div>
  </div>

  <!-- Category Nav -->
  <div class="px-4 mb-3 flex gap-2 overflow-x-auto hide-scrollbar">
    <button onclick="filterCategory('all', event)" class="cat-pill active px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-white transition whitespace-nowrap">All Items</button>
    <button onclick="filterCategory('combos', event)" class="cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-white text-slate-600 border border-slate-200 transition whitespace-nowrap">🔥 Campus Combos</button>
    <button onclick="filterCategory('treats', event)" class="cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-white text-slate-600 border border-slate-200 transition whitespace-nowrap">Ice Creams (₹5 - ₹90)</button>
  </div>

  <!-- Menu List (Ascending Price Sequence) -->
  <main class="px-4 space-y-3" id="menuContainer"></main>

  <!-- Floating Sticky Cart Bar -->
  <div id="cartBar" class="fixed bottom-4 left-4 right-4 z-40 hidden transition-all transform duration-300">
    <div class="bg-slate-900 text-white rounded-2xl p-3 px-4 shadow-2xl flex items-center justify-between border border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-orange-500 flex items-center justify-center font-bold text-white shadow-md">
          <span id="cartCount">0</span>
        </div>
        <div>
          <p class="text-[11px] text-slate-400 font-medium">Total Bill</p>
          <p class="text-base font-extrabold text-white leading-none" id="cartTotal">₹0</p>
        </div>
      </div>
      <button onclick="openCheckoutModal()" class="px-5 py-2.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white text-xs font-extrabold rounded-xl flex items-center gap-1.5 shadow-lg shadow-orange-500/20 active:scale-95 transition">
        <span>Review & Order</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Checkout Modal -->
  <div id="checkoutModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
        <div>
          <h3 class="font-bold text-slate-900 text-base">Complete Your Order</h3>
          <p class="text-xs text-slate-500">Live Counter POS Dispatch</p>
        </div>
        <button onclick="closeCheckoutModal()" class="p-1 rounded-full text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="bg-slate-50 rounded-xl p-3 mb-4 space-y-2 border border-slate-100" id="checkoutItemsList"></div>

      <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Aapka Naam</label>
          <input type="text" id="custName" required placeholder="e.g. Aman Sharma" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Phone Number (WhatsApp Bill Ke Liye)</label>
          <input type="tel" id="custPhone" required placeholder="10-digit mobile number" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Campus Spot / Delivery Point</label>
          <input type="text" id="custSpot" required placeholder="e.g. Counter Pickup / Room 204" class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Payment Mode</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="flex items-center gap-2 p-2.5 border border-slate-200 rounded-xl cursor-pointer text-xs font-semibold text-slate-700 bg-white has-[:checked]:border-orange-500 has-[:checked]:bg-orange-50">
              <input type="radio" name="payMode" value="UPI" checked class="text-orange-500 focus:ring-orange-500">
              <span>UPI at Counter</span>
            </label>
            <label class="flex items-center gap-2 p-2.5 border border-slate-200 rounded-xl cursor-pointer text-xs font-semibold text-slate-700 bg-white has-[:checked]:border-orange-500 has-[:checked]:bg-orange-50">
              <input type="radio" name="payMode" value="Cash" class="text-orange-500 focus:ring-orange-500">
              <span>Cash on Hand</span>
            </label>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="w-full py-3 mt-2 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-orange-500/25 active:scale-95 transition">
          Confirm & Send to Counter
        </button>
      </form>
    </div>
  </div>

  <!-- Live Orders Status Modal -->
  <div id="ordersModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md max-h-[85vh] overflow-y-auto p-5 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
        <div>
          <h3 class="font-bold text-slate-900 text-base">Your Active Orders</h3>
          <p class="text-xs text-slate-500">Real-time status updates</p>
        </div>
        <button onclick="toggleOrdersModal()" class="p-1 rounded-full text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="activeOrdersList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    // 1. Firebase Integration
    const firebaseConfig = {
      apiKey: "AIzaSyBNrqI6Qc5tU4Ittr1Cdk6B-wDGZAQ8pLc",
      authDomain: "the-bunk-spot-b93b9.firebaseapp.com",
      projectId: "the-bunk-spot-b93b9",
      storageBucket: "the-bunk-spot-b93b9.firebasestorage.app",
      messagingSenderId: "289315393663",
      appId: "1:289315393663:web:02bb1d1665b212e972c49c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. Full Ascending Price Catalog
    const menuItems = [
      { id: 'm1', name: "Fresher’s Vibe", desc: "Popitos (Katcha Mango)(Minimum 4pc order)", price: 5, cat: "treats", badge: "Budget" },
      { id: 'm2', name: "Gossip Bites", desc: "Cotton Candy Bites(Minimum 4pc order)", price: 5, cat: "treats", badge: "Budget" },
      { id: 'm3', name: "The Backbencher", desc: "Ice Cream Donut (Cream N Cookie)(Minimum 2pc order)", price: 15, cat: "treats" },
      { id: 'm4', name: "Attendance Short", desc: "Chocobar Mini", price: 30, cat: "treats" },
      { id: 'c1', name: "Pocket Friendly Trio", desc: "Fresher's Vibe + Gossip Bites + Attendance Short", price: 35, cat: "combos", badge: "Combo Save ₹5" },
      { id: 'm5', name: "Late Night Binge", desc: "Belgian Chocolate Sandwich", price: 45, cat: "treats" },
      { id: 'm6', name: "Mood Swings", desc: "2-in-1 (Mango & Vanilla)", price: 45, cat: "treats" },
      { id: 'c2', name: "The Backbencher Deal", desc: "1 Backbencher + 1 Late Night Binge", price: 55, cat: "combos", badge: "Combo Save ₹5" },
      { id: 'm7', name: "Semester Topper", desc: "Kulfi King (Kesar Badam)", price: 75, cat: "treats" },
      { id: 'm8', name: "Hostel Jugad", desc: "Mini Bar (Vanilla Fudge Brownie)", price: 75, cat: "treats" },
      { id: 'm9', name: "Dual Buzz", desc: "Dual Bar (Butterscotch & Vanilla)", price: 75, cat: "treats" },
      { id: 'm10', name: "Canteen Crush", desc: "Cookie Delight Bar", price: 90, cat: "treats", badge: "Signature" },
      { id: 'c3', name: "Twin Blast Combo", desc: "1 Dual Buzz + 1 Hostel Jugad", price: 140, cat: "combos", badge: "Combo Save ₹10" }
    ];

    let cart = {};

    function renderMenu(filter = 'all') {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';
      const filtered = filter === 'all' ? menuItems : menuItems.filter(i => i.cat === filter);

      filtered.forEach(item => {
        const qty = cart[item.id] || 0;
        const card = document.createElement('div');
        card.className = "bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center justify-between gap-3";
        card.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-1.5 mb-1">
              <h4 class="font-bold text-slate-900 text-sm">${item.name}</h4>
              ${item.badge ? `<span class="text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-800">${item.badge}</span>` : ''}
            </div>
            <p class="text-xs text-slate-500 leading-snug">${item.desc}</p>
            <p class="text-sm font-black text-slate-900 mt-1">₹${item.price}</p>
          </div>
          <div class="flex items-center gap-2">
            ${qty === 0 ? `
              <button onclick="updateQty('${item.id}', 1)" class="px-3.5 py-1.5 rounded-xl bg-orange-50 text-orange-600 border border-orange-200 text-xs font-bold hover:bg-orange-100 transition active:scale-95">
                + ADD
              </button>
            ` : `
              <div class="flex items-center bg-slate-900 text-white rounded-xl overflow-hidden p-1 gap-2 shadow-sm">
                <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 flex items-center justify-center rounded-lg hover:bg-slate-800 active:scale-90">-</button>
                <span class="text-xs font-extrabold w-4 text-center">${qty}</span>
                <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center rounded-lg hover:bg-slate-800 active:scale-90">+</button>
              </div>
            `}
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    function updateQty(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      updateCartUI();
      renderMenu();
    }

    function updateCartUI() {
      const bar = document.getElementById('cartBar');
      let count = 0;
      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = menuItems.find(m => m.id === id);
        if (item) {
          count += qty;
          total += item.price * qty;
        }
      }
      document.getElementById('cartCount').innerText = count;
      document.getElementById('cartTotal').innerText = `₹${total}`;
      bar.classList.toggle('hidden', count === 0);
    }

    function filterCategory(cat, e) {
      document.querySelectorAll('.cat-pill').forEach(btn => {
        btn.className = "cat-pill px-4 py-1.5 rounded-full text-xs font-bold bg-white text-slate-600 border border-slate-200 transition whitespace-nowrap";
      });
      e.target.className = "cat-pill active px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-white transition whitespace-nowrap";
      renderMenu(cat);
    }

    function openCheckoutModal() {
      const list = document.getElementById('checkoutItemsList');
      list.innerHTML = '';
      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = menuItems.find(m => m.id === id);
        total += item.price * qty;
        list.innerHTML += `
          <div class="flex justify-between items-center text-xs">
            <span class="font-medium text-slate-700">${item.name} × ${qty}</span>
            <span class="font-bold text-slate-900">₹${item.price * qty}</span>
          </div>
        `;
      }
      list.innerHTML += `
        <div class="border-t border-slate-200 pt-2 flex justify-between items-center font-extrabold text-sm text-slate-900">
          <span>Grand Total</span>
          <span>₹${total}</span>
        </div>
      `;

      const savedUser = JSON.parse(localStorage.getItem('bunk_user_profile') || '{}');
      if (savedUser.name) document.getElementById('custName').value = savedUser.name;
      if (savedUser.phone) document.getElementById('custPhone').value = savedUser.phone;
      if (savedUser.spot) document.getElementById('custSpot').value = savedUser.spot;

      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModal').classList.add('hidden');
    }

    async function submitOrder(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Placing order...";

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const spot = document.getElementById('custSpot').value.trim();
      const payMode = document.querySelector('input[name="payMode"]:checked').value;

      localStorage.setItem('bunk_user_profile', JSON.stringify({ name, phone, spot }));

      const orderId = 'ORD-' + Math.floor(1000 + Math.random() * 9000);
      let items = [];
      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const item = menuItems.find(m => m.id === id);
        items.push({ name: item.name, price: item.price, qty: qty });
        total += item.price * qty;
      }

      try {
        await db.collection("orders").add({
          orderId,
          customerName: name,
          phone,
          spot,
          paymentMode: payMode,
          items,
          total,
          status: 'Placed',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        cart = {};
        updateCartUI();
        renderMenu();
        closeCheckoutModal();
        listenToMyOrders(phone);
        toggleOrdersModal();
      } catch (err) {
        alert("Order submission error: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Confirm & Send to Counter";
      }
    }

    function toggleOrdersModal() {
      const modal = document.getElementById('ordersModal');
      modal.classList.toggle('hidden');
    }

    function listenToMyOrders(phone) {
      if (!phone) return;
      db.collection("orders").where("phone", "==", phone)
        .onSnapshot((snapshot) => {
          const container = document.getElementById('activeOrdersList');
          container.innerHTML = '';
          const orders = [];
          snapshot.forEach(doc => orders.push(doc.data()));

          const activeCount = orders.filter(o => o.status !== 'Completed').length;
          const badge = document.getElementById('activeOrdersBadge');
          badge.innerText = activeCount;
          badge.classList.toggle('hidden', activeCount === 0);

          if (orders.length === 0) {
            container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">Aapka koi active order nahi hai.</div>`;
            return;
          }

          orders.sort((a,b) => ((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0));

          orders.forEach(ord => {
            let statusColor = "bg-amber-100 text-amber-800 border-amber-200";
            if (ord.status === 'Preparing') statusColor = "bg-blue-100 text-blue-800 border-blue-200";
            if (ord.status === 'Ready') statusColor = "bg-emerald-100 text-emerald-800 border-emerald-200";
            if (ord.status === 'Completed') statusColor = "bg-slate-100 text-slate-600 border-slate-200";

            container.innerHTML += `
              <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50">
                <div class="flex justify-between items-center mb-2">
                  <span class="text-xs font-black text-slate-900">#${ord.orderId}</span>
                  <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full border ${statusColor}">${ord.status}</span>
                </div>
                <p class="text-xs text-slate-600 mb-2">${ord.items.map(i => `${i.name} (${i.qty})`).join(', ')}</p>
                <div class="flex justify-between items-center text-xs font-bold text-slate-800 pt-2 border-t border-slate-200/60">
                  <span>Total: ₹${ord.total} (${ord.paymentMode})</span>
                  <span class="text-[10px] text-slate-400 font-medium">${ord.spot}</span>
                </div>
              </div>
            `;
          });
          lucide.createIcons();
        });
    }

    renderMenu();
    const savedUser = JSON.parse(localStorage.getItem('bunk_user_profile') || '{}');
    if (savedUser.phone) listenToMyOrders(savedUser.phone);
    lucide.createIcons();
  </script>
</body>
</html>
