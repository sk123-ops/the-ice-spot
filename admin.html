<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Bunk Spot | Counter Kitchen POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- PIN Lock Screen -->
  <div id="pinScreen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl">
      <div class="w-12 h-12 rounded-2xl bg-orange-500/10 text-orange-400 flex items-center justify-center mx-auto mb-3">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h2 class="text-base font-extrabold text-white">Counter Staff Access</h2>
      <p class="text-xs text-slate-400 mt-1 mb-4">Enter 4-digit secret PIN</p>
      
      <input type="password" id="pinInput" maxlength="4" placeholder="••••" class="w-36 text-center tracking-[0.5em] text-2xl font-black py-2 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-orange-500 mb-4">
      
      <button onclick="unlockPOS()" class="w-full py-3 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold text-sm rounded-xl shadow-lg active:scale-95 transition">
        Enter Kitchen POS
      </button>
      <p id="pinError" class="text-xs text-red-400 font-semibold mt-3 hidden">Galat PIN! Dubara koshish karein.</p>
    </div>
  </div>

  <!-- Header Bar -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center font-black text-white shadow-md">
        BS
      </div>
      <div>
        <h1 class="text-sm font-black text-white leading-tight">COUNTER POS DASHBOARD</h1>
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Cloud Connected</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="text-right">
        <p class="text-[10px] font-bold text-slate-400 uppercase">Today's Revenue</p>
        <p class="text-base font-black text-amber-400 leading-none" id="totalSales">₹0</p>
      </div>
      <button onclick="playChime()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 hover:text-white transition" title="Test Alert Chime">
        <i data-lucide="bell" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Live Orders Feed -->
  <main class="p-4 max-w-5xl mx-auto space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-black uppercase tracking-wider text-slate-400">
        Live Orders Queue (<span id="activeCount" class="text-orange-400">0</span>)
      </h2>
      <span class="text-[11px] text-slate-500">Auto-syncs via Firebase</span>
    </div>

    <div id="ordersQueue" class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
      <!-- Injected Live from Firestore -->
    </div>
  </main>

  <script>
    // 1. Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBNrqI6Qc5tU4Ittr1Cdk6B-wDGZAQ8pLc",
      authDomain: "the-bunk-spot-b93b9.firebaseapp.com",
      projectId: "the-bunk-spot-b93b9",
      storageBucket: "the-bunk-spot-b93b9.firebasestorage.app",
      messagingSenderId: "289315393663",
      appId: "1:289315393663:web:02bb1d1665b212e972c49c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Owner Security PIN Handler
    function unlockPOS() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin === "1234") {
        document.getElementById('pinScreen').classList.add('hidden');
        initOrderListener();
      } else {
        document.getElementById('pinError').classList.remove('hidden');
      }
    }

    // Audio Bell Synthesizer
    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.7);
      } catch (e) {}
    }

    // 1-Click WhatsApp Bill Sender Function
    function sendWhatsAppBill(orderDataStr) {
      const ord = JSON.parse(decodeURIComponent(orderDataStr));
      let phone = ord.phone.replace(/[^0-9]/g, '');
      if (phone.length === 10) {
        phone = '91' + phone;
      }

      let itemsFormatted = '';
      ord.items.forEach(item => {
        itemsFormatted += `• ${item.name} x ${item.qty} = ₹${item.price * item.qty}\n`;
      });

      const message = 
`🍦 *THE BUNK SPOT - BILL RECEIPT* 🍦
--------------------------------
*Order ID:* #${ord.orderId}
*Customer:* ${ord.customerName}
*Spot:* ${ord.spot}
--------------------------------
*ITEMS ORDERED:*
${itemsFormatted}--------------------------------
*TOTAL AMOUNT: ₹${ord.total}*
*Payment Mode:* ${ord.paymentMode}
*Status:* Completed & Delivered ✅
--------------------------------
Thank you for visiting *The Bunk Spot*! ✨
Have a sweet day ahead!`;

      const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      window.open(waUrl, '_blank');
    }

    let isInitialLoad = true;

    function initOrderListener() {
      db.collection("orders").orderBy("createdAt", "desc")
        .onSnapshot((snapshot) => {
          const queue = document.getElementById('ordersQueue');
          queue.innerHTML = '';

          let totalRev = 0;
          let active = 0;

          snapshot.docChanges().forEach(change => {
            if (change.type === "added" && !isInitialLoad) {
              playChime();
            }
          });
          isInitialLoad = false;

          snapshot.forEach(doc => {
            const ord = doc.data();
            const docId = doc.id;

            if (ord.status === 'Completed') {
              totalRev += ord.total;
              return;
            }

            active++;
            const encodedOrder = encodeURIComponent(JSON.stringify(ord));
            const card = document.createElement('div');
            card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl";
            card.innerHTML = `
              <div class="flex justify-between items-center mb-2.5">
                <div>
                  <span class="text-sm font-black text-amber-400">#${ord.orderId}</span>
                  <span class="ml-2 text-xs font-bold text-white">${ord.customerName}</span>
                </div>
                <span class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full ${ord.status === 'Placed' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/30' : 'bg-blue-500/20 text-blue-400 border border-blue-500/30'}">
                  ${ord.status}
                </span>
              </div>

              <div class="text-xs text-slate-400 mb-3 space-y-1">
                <p class="flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-500"></i> ${ord.spot}</p>
                <p class="flex items-center gap-1.5"><i data-lucide="phone" class="w-3.5 h-3.5 text-slate-500"></i> ${ord.phone}</p>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 mt-2">
                  <p class="text-slate-200 font-semibold">${ord.items.map(i => `${i.name} × ${i.qty}`).join(', ')}</p>
                </div>
              </div>

              <div class="flex items-center justify-between pt-3 border-t border-slate-800">
                <span class="text-sm font-black text-white">₹${ord.total} <span class="text-[11px] text-slate-400 font-normal">(${ord.paymentMode})</span></span>
                
                <div class="flex items-center gap-1.5">
                  <!-- WhatsApp Bill Button -->
                  <button onclick="sendWhatsAppBill('${encodedOrder}')" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-lg flex items-center gap-1 shadow-md active:scale-95 transition" title="Customer ko WhatsApp par bill bhejo">
                    <i data-lucide="message-circle" class="w-3.5 h-3.5"></i>
                    <span>Bill</span>
                  </button>

                  <!-- Status Workflow Buttons -->
                  ${ord.status === 'Placed' ? `
                    <button onclick="updateOrderStatus('${docId}', 'Preparing')" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-[11px] font-bold rounded-lg active:scale-95 transition">Prep</button>
                  ` : ''}
                  ${ord.status === 'Preparing' ? `
                    <button onclick="updateOrderStatus('${docId}', 'Ready')" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-white text-[11px] font-bold rounded-lg active:scale-95 transition">Ready</button>
                  ` : ''}
                  ${ord.status === 'Ready' ? `
                    <button onclick="updateOrderStatus('${docId}', 'Completed')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-[11px] font-bold rounded-lg active:scale-95 transition">Complete</button>
                  ` : ''}
                </div>
              </div>
            `;
            queue.appendChild(card);
          });

          document.getElementById('totalSales').innerText = `₹${totalRev}`;
          document.getElementById('activeCount').innerText = active;

          if (active === 0) {
            queue.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs">Abhi kitchen queue me koi active order nahi hai.</div>`;
          }
          lucide.createIcons();
        });
    }

    function updateOrderStatus(docId, nextStatus) {
      db.collection("orders").doc(docId).update({
        status: nextStatus
      });
    }

    lucide.createIcons();
  </script>
</body>
</html>
