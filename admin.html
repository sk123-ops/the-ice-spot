<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Ice Spot | Admin Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .badge-placed { background-color: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }
    .badge-prep { background-color: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-ready { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen select-none">

  <!-- PIN Authentication Screen -->
  <div id="pinScreen" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl">
      <div class="w-14 h-14 rounded-2xl bg-blue-500/10 text-blue-400 flex items-center justify-center mx-auto mb-3">
        <i data-lucide="shield-check" class="w-7 h-7"></i>
      </div>
      <h2 class="text-lg font-extrabold text-white">The Ice Spot Console</h2>
      <p class="text-xs text-slate-400 mt-1 mb-5">Enter 4-digit security PIN</p>
      
      <input type="password" id="pinInput" maxlength="4" placeholder="••••" 
        class="w-40 text-center tracking-[0.5em] text-3xl font-black py-2.5 rounded-2xl bg-slate-950 border border-slate-700 text-sky-400 focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4">
      
      <button onclick="unlockPOS()" class="w-full py-3 bg-gradient-to-r from-blue-600 to-sky-500 font-extrabold text-sm rounded-xl shadow-lg active:scale-95 transition">
        Unlock Dashboard
      </button>
      <p id="pinError" class="text-xs text-red-400 font-semibold mt-3 hidden">Incorrect PIN! Default: 1234</p>
    </div>
  </div>

  <!-- Main Console -->
  <div id="mainConsole" class="hidden">
    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 sticky top-0 z-30 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-blue-600 flex items-center justify-center font-black text-white shadow-md">
          IS
        </div>
        <div>
          <h1 class="text-sm font-black text-white">THE ICE SPOT POS</h1>
          <p class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Cloud Synchronized
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="playChime()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300" title="Test Chime">
          <i data-lucide="bell" class="w-4 h-4"></i>
        </button>
        <button onclick="lockPOS()" class="p-2 bg-slate-800 hover:bg-red-950/40 rounded-xl text-slate-400 hover:text-red-400" title="Lock Panel">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="p-4 max-w-6xl mx-auto grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
        <p class="text-[10px] font-bold uppercase text-slate-400">Total Revenue</p>
        <p class="text-xl font-black text-sky-400 mt-1" id="statRevenue">₹0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
        <p class="text-[10px] font-bold uppercase text-slate-400">Active Queue</p>
        <p class="text-xl font-black text-orange-400 mt-1" id="statActive">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
        <p class="text-[10px] font-bold uppercase text-slate-400">Completed</p>
        <p class="text-xl font-black text-emerald-400 mt-1" id="statCompleted">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 flex flex-col justify-between">
        <p class="text-[10px] font-bold uppercase text-slate-400">Clean Free Storage</p>
        <button onclick="clearHistory()" class="px-2.5 py-1 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-500/30 rounded-lg text-[10px] font-bold transition">
          🗑️ Clear History
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="px-4 max-w-6xl mx-auto mb-4 flex gap-2 border-b border-slate-800 pb-3">
      <button onclick="switchTab('active')" id="tabActiveBtn" class="px-4 py-1.5 rounded-xl text-xs font-black bg-blue-600 text-white transition">Active Orders</button>
      <button onclick="switchTab('stock')" id="tabStockBtn" class="px-4 py-1.5 rounded-xl text-xs font-black bg-slate-900 text-slate-400 border border-slate-800 transition">📦 Stock Counter</button>
      <button onclick="switchTab('completed')" id="tabCompletedBtn" class="px-4 py-1.5 rounded-xl text-xs font-black bg-slate-900 text-slate-400 border border-slate-800 transition">Completed History</button>
    </div>

    <!-- Orders Queue Grid -->
    <main id="ordersSection" class="p-4 max-w-6xl mx-auto">
      <div id="ordersGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5"></div>
    </main>

    <!-- Stock Manager Section -->
    <main id="stockSection" class="p-4 max-w-4xl mx-auto hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h3 class="text-sm font-black text-white">Live Stock Limits & Counters</h3>
            <p class="text-xs text-slate-400">Auto-decrements with each order. Reaching 0 sets item to SOLD OUT.</p>
          </div>
        </div>
        <div id="stockList" class="space-y-2.5"></div>
      </div>
    </main>
  </div>

  <script>
    // Security Guard: Anti-Inspect

    document.onkeydown = e => {
      if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
    };

    const firebaseConfig = {
      apiKey: "AIzaSyBNrqI6Qc5tU4Ittr1Cdk6B-wDGZAQ8pLc",
      authDomain: "the-bunk-spot-b93b9.firebaseapp.com",
      projectId: "the-bunk-spot-b93b9",
      storageBucket: "the-bunk-spot-b93b9.firebasestorage.app",
      messagingSenderId: "289315393663",
      appId: "1:289315393663:web:02bb1d1665b212e972c49c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const menuItems = [
  { 
    id: 'm1', 
    name: "Cotton Candy Bites", 
    desc: "Cotton Candy Flavored Ice Cream", 
    price: 5, 
    pic: "cottan candy.png" 
  },
  {

  },
  {

    price: 10,

  },
  { 
    id: 'm4', 
    name: "Chocobar Mini", 
    desc: "Chocolate Coated Vanilla Ice Cream", 
    price: 20, 
    pic: "chocobar mini.png" 
  },
  { 
    id: 'm5',

    price: 20, 
    pic: "spiral.png" 
  },
  { 
    id: 'm6', 
    name: "2-in-1 (Mango & Vanilla)", 
    desc: "Mango & Vanilla Flavored Ice Cream", 
    price: 30, 
    pic: "two-in-one.png" 
  },
  {

  },
  {

  },
  { 
    id: 'm9',

    price: 30, 
    pic: "neapolitan1.png" 
  },
  { 
    id: 'm10', 
    name: "ibar Mini (Mango Delight)", 
    desc: "Mango Delight with White Dip Coating", 
    price: 40, 
    pic: "mango delight.png" 
  },
  { 
    id: 'm11', 
    name: "Dual Bar (Butterscotch)", 
    desc: "Butterscotch & Vanilla Swirl Bar", 
    price: 50, 
    pic: "dual-butter.png" 
  },
  { 
    id: 'm12', 
    name: "Dual Bar (Strawberry)", 
    desc: "Strawberry & Vanilla Flavored Bar", 
    price: 50, 
    pic: "dual strawberry.png" 
  },
  { 
    id: 'm13', 
    name: "Kulfi King", 
    desc: "Traditional Pista Badam Desi Kulfi", 
    price: 50, 
    pic: "Kulfi king1.png" 
  },
  { 
    id: 'm14', 
    name: "ibar Mini (Belgian Choco)", 
    desc: "Rich Belgian Chocolate Flavored Bar", 
    price: 50, 
    pic: "Belgian choco.png" 
  }
];

    let currentTab = 'active';
    let allOrders = [];
    let inventoryState = {};
    let isInitialLoad = true;

    function unlockPOS() {
      if (document.getElementById('pinInput').value.trim() === "1234") {
        document.getElementById('pinScreen').classList.add('hidden');
        document.getElementById('mainConsole').classList.remove('hidden');
        initListeners();
      } else {
        document.getElementById('pinError').classList.remove('hidden');
      }
    }

    function lockPOS() {
      document.getElementById('pinInput').value = '';
      document.getElementById('mainConsole').classList.add('hidden');
      document.getElementById('pinScreen').classList.remove('hidden');
    }

    // Audio Chime Bell
    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880.00, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.7);
      } catch (e) {}
    }

    // Feature 2: Voice Announcement Speaker
    function speakCallout(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = 0.95;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      const actBtn = document.getElementById('tabActiveBtn');
      const stcBtn = document.getElementById('tabStockBtn');
      const comBtn = document.getElementById('tabCompletedBtn');
      const ordersSec = document.getElementById('ordersSection');
      const stockSec = document.getElementById('stockSection');

      [actBtn, stcBtn, comBtn].forEach(b => b.className = "px-4 py-1.5 rounded-xl text-xs font-black bg-slate-900 text-slate-400 border border-slate-800 transition");

      if (tab === 'stock') {
        stcBtn.className = "px-4 py-1.5 rounded-xl text-xs font-black bg-sky-500 text-white transition";
        ordersSec.classList.add('hidden');
        stockSec.classList.remove('hidden');
        renderStockUI();
      } else {
        stockSec.classList.add('hidden');
        ordersSec.classList.remove('hidden');
        if (tab === 'active') actBtn.className = "px-4 py-1.5 rounded-xl text-xs font-black bg-blue-600 text-white transition";
        if (tab === 'completed') comBtn.className = "px-4 py-1.5 rounded-xl text-xs font-black bg-emerald-600 text-white transition";
        renderOrdersUI();
      }
    }

    function sendWhatsAppBill(orderDataStr) {
      const ord = JSON.parse(decodeURIComponent(orderDataStr));
      let phone = (ord.phone || '').replace(/[^0-9]/g, '');
      if (phone.length === 10) phone = '91' + phone;

      let itemsStr = '';
      ord.items.forEach(i => itemsStr += `• ${i.name} x ${i.qty} = ₹${i.price * i.qty}\n`);

      const msg = `🍦 *THE ICE SPOT - RECEIPT* 🍦\n------------------------\n*Order ID:* #${ord.orderId}\n*Customer:* ${ord.customerName}\n*Spot:* ${ord.spot}\n------------------------\n${itemsStr}------------------------\n*GRAND TOTAL: ₹${ord.total}*\n*Payment Mode:* ${ord.paymentMode}\n*Status:* Completed & Delivered ✅\n------------------------\nThank you for ordering at *The Ice Spot*! ✨`;
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function initListeners() {
      // 1. Realtime Orders Stream
      db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === "added" && !isInitialLoad) playChime();
        });
        isInitialLoad = false;

        allOrders = [];
        snapshot.forEach(doc => allOrders.push({ id: doc.id, ...doc.data() }));

        let rev = 0, act = 0, comp = 0;
        allOrders.forEach(o => {
          if (o.status === 'Completed') { rev += (Number(o.total) || 0); comp++; }
          else { act++; }
        });

        document.getElementById('statRevenue').innerText = `₹${rev}`;
        document.getElementById('statActive').innerText = act;
        document.getElementById('statCompleted').innerText = comp;

        if (currentTab !== 'stock') renderOrdersUI();
      });

      // 2. Realtime Inventory Stream
      db.collection("settings").doc("inventory").onSnapshot(doc => {
        inventoryState = doc.exists ? (doc.data().items || {}) : {};
        if (currentTab === 'stock') renderStockUI();
      });
    }

    function renderOrdersUI() {
      const container = document.getElementById('ordersGrid');
      container.innerHTML = '';

      const filtered = allOrders.filter(ord => currentTab === 'active' ? ord.status !== 'Completed' : ord.status === 'Completed');

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full py-16 text-center text-slate-500 text-xs font-semibold">No orders in this queue.</div>`;
        return;
      }

      filtered.forEach(ord => {
        const encoded = encodeURIComponent(JSON.stringify(ord));
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl";
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="text-sm font-black text-sky-400">#${ord.orderId}</span>
              <h3 class="text-xs font-bold text-white">${ord.customerName}</h3>
            </div>
            <span class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full ${ord.status === 'Placed' ? 'badge-placed' : ord.status === 'Preparing' ? 'badge-prep' : 'badge-ready'}">${ord.status}</span>
          </div>
          <p class="text-[11px] text-slate-400 mb-2">📍 ${ord.spot} | 📞 ${ord.phone}</p>
          <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 mb-3 space-y-0.5">
            ${ord.items.map(i => `<div class="flex justify-between text-xs"><span>${i.name} × ${i.qty}</span><span class="font-bold">₹${i.price * i.qty}</span></div>`).join('')}
          </div>
          <div class="pt-2 border-t border-slate-800 flex justify-between items-center">
            <span class="text-sm font-black text-white">₹${ord.total}</span>
            <div class="flex gap-1.5">
              <button onclick="sendWhatsAppBill('${encoded}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-lg shadow transition">📱 Bill</button>
              ${ord.status === 'Placed' ? `<button onclick="updateOrderStatus('${ord.id}', 'Preparing')" class="px-2.5 py-1 bg-blue-600 text-white text-[11px] font-bold rounded-lg transition">Prep</button>` : ''}
              ${ord.status === 'Preparing' ? `<button onclick="markOrderReady('${ord.id}', '${ord.orderId}', '${ord.customerName}')" class="px-2.5 py-1 bg-amber-500 text-white text-[11px] font-bold rounded-lg transition flex items-center gap-1"><i data-lucide='volume-2' class='w-3 h-3'></i> Ready</button>` : ''}
              ${ord.status === 'Ready' ? `<button onclick="updateOrderStatus('${ord.id}', 'Completed')" class="px-2.5 py-1 bg-slate-700 text-white text-[11px] font-bold rounded-lg transition">Done</button>` : ''}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    // Trigger Voice Callout on Ready
    function markOrderReady(docId, orderId, name) {
      updateOrderStatus(docId, 'Ready');
      speakCallout(`Order number ${orderId.replace('-', ' ')} for ${name} is ready for pickup!`);
    }

    function renderStockUI() {
      const container = document.getElementById('stockList');
      container.innerHTML = '';

      catalogItems.forEach(item => {
        const itemState = inventoryState[item.id] || { stock: 30, soldOut: false };
        const isSoldOut = itemState.soldOut || itemState.stock <= 0;

        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-3.5 bg-slate-950 rounded-2xl border border-slate-800";
        row.innerHTML = `
          <div>
            <h4 class="text-xs font-bold text-white">${item.name} (₹${item.price})</h4>
            <span class="text-[10px] ${isSoldOut ? 'text-red-400 font-bold' : 'text-emerald-400 font-bold'}">
              ${isSoldOut ? '● SOLD OUT' : `● IN STOCK (${itemState.stock} Remaining)`}
            </span>
          </div>

          <div class="flex items-center gap-2">
            <!-- Exact Stock Counter -->
            <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl px-2 py-1 gap-2">
              <span class="text-[10px] text-slate-400 font-semibold">Qty:</span>
              <input type="number" min="0" value="${itemState.stock}" onchange="setCustomStock('${item.id}', this.value)" 
                class="w-12 bg-transparent text-center font-bold text-xs text-sky-400 focus:outline-none">
            </div>

            <!-- Instant Sold Out Toggle Button -->
            <button onclick="toggleSoldOut('${item.id}', ${!isSoldOut})" 
              class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${isSoldOut ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'}">
              ${isSoldOut ? 'Available' : 'Sold Out'}
            </button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    async function setCustomStock(itemId, count) {
      const newCount = Math.max(0, parseInt(count) || 0);
      const existing = inventoryState[itemId] || {};
      inventoryState[itemId] = {
        stock: newCount,
        soldOut: newCount === 0
      };
      await db.collection("settings").doc("inventory").set({ items: inventoryState }, { merge: true });
    }

    async function toggleSoldOut(itemId, shouldBeSoldOut) {
      const existing = inventoryState[itemId] || { stock: 30 };
      inventoryState[itemId] = {
        stock: shouldBeSoldOut ? 0 : (existing.stock > 0 ? existing.stock : 20),
        soldOut: shouldBeSoldOut
      };
      await db.collection("settings").doc("inventory").set({ items: inventoryState }, { merge: true });
    }

    function updateOrderStatus(id, status) {
      db.collection("orders").doc(id).update({ status });
    }

    async function clearHistory() {
      const completedDocs = allOrders.filter(o => o.status === 'Completed');
      if (completedDocs.length === 0) {
        alert("Completed history is already clean!");
        return;
      }
      if (confirm(`Delete ${completedDocs.length} completed orders permanently?`)) {
        const batch = db.batch();
        completedDocs.forEach(doc => {
          batch.delete(db.collection("orders").doc(doc.id));
        });
        await batch.commit();
        alert("Database history cleared successfully!");
      }
    }

    lucide.createIcons();
  </script>
</body>
